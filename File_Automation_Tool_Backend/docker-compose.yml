

services:
  secure-redis:
    image: bitnami/redis:latest
    container_name: secure-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_CONFIG_FILE=/opt/bitnami/redis/mounted-etc/redis.conf
      - REDIS_PASSWORD=pass
    volumes:
      - "C:/Users/AL-AMEER S R/Desktop/2025 plan/Springboot projects/redis.conf:/opt/bitnami/redis/mounted-etc/redis.conf"
      - "C:/Users/AL-AMEER S R/Desktop/2025 plan/Springboot projects/users.acl:/opt/bitnami/redis/mounted-etc/users.acl"
      # Uncomment for persistent Redis data:
      # - "C:/Users/AL-AMEER S R/Desktop/2025 plan/Springboot projects/redisData:/bitnami/redis"

  file-automation-tool:
    build:
      context: .
      dockerfile: Dockerfile
    image: file-automation-tool:latest
    container_name: file-automation-tool
    depends_on:
      - secure-redis
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=host.docker.internal
      - SPRING_DATA_REDIS_HOST=secure-redis
      - SPRING_DATA_REDIS_PORT=6379
      - REDIS_USERNAME=ameer
      - REDIS_PASSWORD=pass
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - file-automation-tool

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
