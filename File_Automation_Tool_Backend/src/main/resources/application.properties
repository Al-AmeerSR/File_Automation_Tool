# ========== DATABASE ==========
spring.datasource.username=username
spring.datasource.password=password
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/database_name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ========== HikariCP SETTINGS ==========
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=MyHikariCP
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# ========== QUARTZ ==========
spring.quartz.job-store-type=jdbc
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.StdJDBCDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.jobStore.useProperties=false

# ========== BATCH ==========
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ========== CUSTOM ==========
report.folder.path=./reports

# ========== SECURITY ==========
secret.key=256bit secret key

# ========== REDIS ==========
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:username}
spring.data.redis.password=${REDIS_PASSWORD:password}

